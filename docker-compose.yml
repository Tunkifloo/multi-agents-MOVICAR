# MOVICAR · Asistente multiagente (LangChain + LangGraph + Gemini)
#   docker compose up -d --build      → http://localhost:8088 (WEB_PORT en .env)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movicar
      POSTGRES_USER: movicar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movicar -d movicar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: movicar-backend:3.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://movicar:${POSTGRES_PASSWORD}@db:5432/movicar
      CORS_ORIGENES: http://localhost:${WEB_PORT:-8088}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # solo local: scripts de prueba y documentación /docs
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: movicar-backend:3.0
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://movicar:${POSTGRES_PASSWORD}@db:5432/movicar
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build:
      context: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
